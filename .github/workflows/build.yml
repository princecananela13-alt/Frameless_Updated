name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP" || { echo "ZIP missing"; exit 1; }
          mkdir source
          unzip -o "$ZIP" -d source

      - name: Build APK
        run: |
          cd source
          GRADLE_FILE=$(find . -name build.gradle -type f | head -1)
          test -n "$GRADLE_FILE" || { echo "build.gradle missing"; exit 1; }
          cd "$(dirname "$GRADLE_FILE")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frameless-AI-APK
          path: source/**/*.apk
